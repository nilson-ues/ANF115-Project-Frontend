name: Desplegar frontend

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Verificar configuración
        id: config
        env:
          API_URL: ${{ vars.API_URL }}
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::Falta la variable API_URL o el secreto AZURE_STATIC_WEB_APPS_API_TOKEN; se compila pero no se despliega."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            sed -i "s#__API_URL__#${API_URL}#" src/environments/environment.ts
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npx ng build --configuration production

      - uses: Azure/static-web-apps-deploy@v1
        if: steps.config.outputs.listo == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/distrifarma-web/browser
          skip_app_build: true
          skip_api_build: true
